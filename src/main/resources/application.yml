spring:
  config:
    import: "optional:configtree:/run/secrets/"
  application:
    name: connector.discord
  data:
    mongodb:
      # Le connecteur ne garde que ce qui lui est propre : salons suivis, messages postés,
      # utilisateurs Discord. Le domaine vit dans le cœur depuis la phase 3.
      #
      # Utilisateur propre à sa base, créé par `task db:init`. Il détenait les identifiants
      # root jusqu'au 17-09 : plus aucun service applicatif ne les a désormais.
      uri: mongodb://${MONGO_USERNAME}:${MONGO_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DB}?authSource=${MONGO_DB}

discord:
  token: ${DISCORD_TOKEN}
  admin:
    id: ${DISCORD_ADMIN_ID}
    username: ${DISCORD_ADMIN_USERNAME}

# Secret partagé par tous les services Schub.
schub:
  internal-secret: ${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

# Le cœur détient le domaine. Ce connecteur ne fait que traduire des intentions Discord en
# appels, et afficher ce que le cœur rapporte.
core:
  base-url: ${CORE_URL:http://schub-core:8080}
  # « Push pour la latence, pull pour la correction » (plan §5) : le cœur pousse les
  # changements, ce pull rattrape ceux qui se sont perdus. C'est lui qui rend inutile
  # toute garantie de livraison — donc tout broker.
  pull-interval: ${CORE_PULL_INTERVAL:1m}
  connect-timeout: 3s
  read-timeout: 10s

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
