spring:
  config:
    # Le second import charge les règles de ports permanentes depuis un fichier monté,
    # éditable à la main sans reconstruire l'image (appliqué au redémarrage du bot).
    import: "optional:configtree:/run/secrets/,optional:file:/etc/schub/port-forwarding.yml"
  application:
    name: mongodb
  data:
    mongodb:
      uri: mongodb://${MONGO_ROOT_USERNAME}:${MONGO_ROOT_PASSWORD}@${MONGO_HOST}:27017/${MONGO_DB}?authSource=admin
discord:
  token: ${DISCORD_TOKEN}
  admin:
    id: ${DISCORD_ADMIN_ID}
    username: ${DISCORD_ADMIN_USERNAME}
portainer:
  base-url: ${PORTAINER_VIRTUAL_HOST}
  token: ${PORTAINER_TOKEN}

# Secret partagé par tous les services Schub.
schub:
  internal-secret: ${SCHUB_INTERNAL_SECRET:change-me-internal-secret}

# Comment joindre le connecteur Freebox. Depuis la phase 1, ce service ne parle plus à la
# box : il délègue à un connecteur qui, lui, détient le jeton d'appairage et l'API du
# routeur. Changer de marque de routeur ne toucherait pas une ligne ici.
connector:
  freebox:
    base-url: ${CONNECTOR_FREEBOX_URL:http://connector-freebox:8080}
    connect-timeout: 3s
    read-timeout: 8s

# Politique d'ouverture des ports. Rien ici ne dépend de la marque du routeur.
port-forwarding:
  enabled: ${PORT_FORWARDING_ENABLED:false}
  dry-run: ${PORT_FORWARDING_DRY_RUN:false}
  # Nœud Swarm visé par défaut (loki, où les stacks de jeu sont contraintes).
  default-lan-ip: ${PORT_FORWARDING_DEFAULT_LAN_IP:192.168.1.202}
  # false : les règles devenues orphelines sont fermées et restent visibles sur le routeur.
  prune-orphans: ${PORT_FORWARDING_PRUNE_ORPHANS:false}
  # Garde-fou : jamais exposés sur Internet, même si une règle les demande.
  forbidden-wan-ports: [22, 23, 139, 445, 3389, 5432, 27017, 9443]
  # Les règles permanentes (port-forwarding.static-rules) ne sont volontairement PAS
  # déclarées ici : elles vivent dans /etc/schub/port-forwarding.yml, monté depuis
  # /mnt/volume/PortForwarding/. Les déclarer aux deux endroits risquerait d'écraser le fichier.
